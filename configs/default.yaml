providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
cache:
  enabled: true
  backend: memory          # "memory" (default) or "redis" (requires docker compose up -d)
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 100
  concurrency: 1           # >1 fans the load out over a ThreadPoolExecutor

# Cost-aware routing. limit: null disables it; above degrade_ratio the gateway prefers the
# cheapest provider, and at 100% of the limit it serves cache-or-static only.
budget:
  limit: null
  degrade_ratio: 0.8

# Chaos scenarios: each overrides provider fail_rate, budget, or concurrency for
# targeted testing.  Pass/fail criteria per scenario live in chaos.SCENARIO_CRITERIA.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic should fallback"
    provider_overrides:
      primary: 1.0
  - name: primary_flaky_50
    description: "Primary provider fails 50% — circuit should oscillate"
    provider_overrides:
      primary: 0.5
  - name: all_healthy
    description: "Baseline — both providers healthy"
    provider_overrides: {}
  - name: cost_budget_squeeze
    description: "Tight cost cap — gateway must demote to the cheap provider, then serve cache only"
    provider_overrides: {}
    budget_limit: 0.008
  - name: concurrent_load_8
    description: "Same healthy config under 8 concurrent workers — stretch goal"
    provider_overrides: {}
    concurrency: 8
